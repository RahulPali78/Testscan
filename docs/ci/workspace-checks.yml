name: Workspace checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate workspace, types and unit behavior
        run: pnpm check
      - name: Build the dashboard
        run: pnpm build
      - name: Exercise PostgreSQL, Temporal and API integration
        run: pnpm test:integration
      - name: Stop development infrastructure
        if: always()
        run: pnpm infra:down
