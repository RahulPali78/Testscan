name: veriqo-foundation

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    environment:
      POSTGRES_USER: veriqo
      POSTGRES_PASSWORD: veriqo_dev
      POSTGRES_DB: veriqo
    ports:
      - "127.0.0.1:${VERIQO_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veriqo -d veriqo"]
      interval: 3s
      timeout: 3s
      retries: 30

  temporal-data-init:
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 1000:1000 /var/temporal"]
    volumes:
      - temporal-data:/var/temporal
    restart: "no"

  temporal:
    image: temporalio/temporal:1.9.1@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e
    environment:
      NO_PROXY: "${NO_PROXY:-},127.0.0.1,localhost,0.0.0.0"
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --ui-ip
      - 0.0.0.0
      - --db-filename
      - /var/temporal/temporal.db
    ports:
      - "127.0.0.1:${VERIQO_TEMPORAL_PORT:-7233}:7233"
      - "127.0.0.1:${VERIQO_TEMPORAL_UI_PORT:-8233}:8233"
    volumes:
      - temporal-data:/var/temporal
    depends_on:
      temporal-data-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  temporal-data:
